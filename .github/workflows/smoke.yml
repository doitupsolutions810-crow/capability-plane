name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crypto deps (subset of requirements.txt used by the core)
        run: python -m pip install --upgrade pip && pip install "cryptography>=42" "PyYAML>=6"
      - name: Byte-compile the service
        run: python -m compileall -q plane_service plane attestpipe
      - name: Crypto smoke (issue -> sign -> verify -> execute; tamper rejected)
        run: python ci/smoke_test.py
