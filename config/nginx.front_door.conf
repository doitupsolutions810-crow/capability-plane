upstream plane_upstream { server 127.0.0.1:8090; }
upstream sovereign_dashboard { server 127.0.0.1:8501; }
server {
    listen 443 ssl http2;
    server_name capability-plane.example.com;
    location = /v1/capabilities/issue { proxy_pass http://plane_upstream; }
    location = /v1/capabilities/attenuate { proxy_pass http://plane_upstream; }
    location = /v1/capabilities/verify { proxy_pass http://plane_upstream; }
    location = /v1/execute { proxy_pass http://plane_upstream; }
    location = /health { proxy_pass http://plane_upstream; }
    location /dashboard/ { proxy_pass http://sovereign_dashboard/; }
    location / { return 404; }
}
